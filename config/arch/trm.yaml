# TRM Architecture Config for Regression Tasks
name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1

# Task type (regression for latent prediction)
task: regression

loss:
  name: losses@RegressionACTLossHead
  loss_type: mse
  halt_tolerance: 1e-2
  halt_target_mode: improvement

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6

H_layers: 0
L_layers: 2

# Model width / heads (approx. 140M params)
hidden_size: 2048
num_heads: 16
expansion: 4

# Regression-specific settings
input_dim: 1024
output_dim: 1024
puzzle_emb_ndim: 0  # Disabled for regression tasks

# RevIN normalization for regression
revin_enabled: true
revin_apply_on_outputs: true

# Cross-attention for VLM context
cross_attn_enabled: true

pos_encodings: rope
forward_dtype: bfloat16

no_ACT_continue: True # No continue ACT loss, only use the sigmoid of the halt
