# BabyGR00T Regression Training Config

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data paths (latent .npz files from GR00T distillation)
data_paths: ['data/gr1_full_upper_body.Coffee']
data_paths_test: []

evaluators:
  - name: regression@Regression

# Hyperparams - Training
global_batch_size: 16

epochs: 100
eval_interval: 10
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# LR schedule: "linear" (warmup+decay) or "plateau" (ReduceLROnPlateau)
lr_schedule: linear
# Plateau scheduler settings (only used when lr_schedule: plateau)
plateau_metric: mse
plateau_factor: 0.5
plateau_patience: 10
plateau_threshold: 1e-4
plateau_cooldown: 0

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1

seed: 0
min_eval_interval: 0 # when to start the eval

ema: False # use Exponential-Moving-Average
ema_rate: 0.999 # EMA-rate

# Optional: post-hoc stochastic weight averaging over saved checkpoints
swa_enabled: False
swa_num_checkpoints: 5
swa_sample: True
swa_seed: 0

# VLM Context (optional - for cross-attention with vision-language embeddings)
# Option 1: Provide explicit list of directories containing VLM .npz files
vlm_context_dirs: []
# Option 2: Provide root directory for auto-discovery of VLM embeddings
# vlm_context_root: "/path/to/vlm_embeddings"
# Option 3: Set environment variable VLM_CONTEXT_ROOT (lowest priority)

# Logging
use_wandb: False      # Default to terminal-only logging
log_interval: 10      # Print train metrics every N steps
